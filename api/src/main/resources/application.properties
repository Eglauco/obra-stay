spring.application.name=hospedagem

# Datasource (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospedagem}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway (schema managed by migrations)
spring.flyway.enabled=true

# Server
server.port=${PORT:8080}

# Armazenamento de arquivos (S3-compatível: MinIO/R2/B2/AWS)
# Desativado por padrão; ative definindo APP_S3_ENABLED=true + as credenciais.
app.s3.enabled=${APP_S3_ENABLED:false}
app.s3.endpoint=${APP_S3_ENDPOINT:}
app.s3.region=${APP_S3_REGION:us-east-1}
app.s3.access-key=${APP_S3_ACCESS_KEY:}
app.s3.secret-key=${APP_S3_SECRET_KEY:}
app.s3.bucket=${APP_S3_BUCKET:obra-stay-desenvolvimento}
# URL pública do endpoint S3 (porta 9000) para montar links diretos; opcional.
app.s3.public-base-url=${APP_S3_PUBLIC_URL:}
# Cria o bucket no startup caso não exista.
app.s3.auto-create-bucket=${APP_S3_AUTO_CREATE_BUCKET:true}
# Upload máximo aceito pelo servidor (foto até 5MB, PDF de contrato até 15MB).
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX:20MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQ:25MB}

# Autenticação (JWT). Em produção defina APP_JWT_SECRET com >= 32 caracteres.
app.jwt.secret=${APP_JWT_SECRET:obrastay-chave-de-desenvolvimento-troque-em-producao-0123456789}
app.jwt.exp-horas=${APP_JWT_EXP_HORAS:8}

# Usuário admin inicial (criado só se a tabela de usuários estiver vazia).
app.admin.nome=${APP_ADMIN_NOME:Administrador}
app.admin.email=${APP_ADMIN_EMAIL:admin@obrastay.com.br}
app.admin.senha=${APP_ADMIN_SENHA:Admin@123}
